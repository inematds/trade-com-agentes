# Agenda das rotinas — reconstrução do método do vídeo eg_1NXDcoPk.
# Formato ilustrativo (não é config de nenhuma ferramenta específica).
# Estudo, não recomendação. Se for testar, use conta SIMULADA (paper).

fuso: America/Chicago        # Central Time; pregão 08:30–15:00
dias: [seg, ter, qua, qui, sex]   # só dias de pregão; feriados desligam
thread: unica                # todas as rotinas escrevem na mesma conversa
modelo: gpt-6-astra
esforco: alto

antes_de_cada_rotina:
  - ler: handoff.md          # último bilhete deixado pela rotina anterior
  - ler: conta_na_corretora  # saldo e posições vêm da fonte oficial, não do bilhete
depois_de_cada_rotina:
  - escrever: handoff.md
  - enviar: recomendacao.json -> executor   # a partir do dia 2 (ver metodo/04)

rotinas:
  - hora: "07:45"
    nome: pre-mercado
    tarefa: ler notícias, conferir a conta, montar a lista de vigilância do dia
  - hora: "09:30"
    nome: primeira-entrada
    tarefa: procurar a primeira operação que passe em todos os portões
  - hora: "11:00"
    nome: meio-do-dia
    tarefa: revisar posições; considerar a ÚLTIMA entrada nova do dia
  - hora: "13:00"
    nome: tarde
    tarefa: administrar posições abertas (stop, alvo, saída)
  - hora: "14:15"
    nome: fechamento
    tarefa: encerrar as posições restantes
  - hora: "14:45"
    nome: confirmacao
    tarefa: confirmar conta zerada e registrar o resultado do dia
  - hora: "15:15"
    nome: aviso
    tarefa: notificação final do dia

portoes_originais:           # como começou
  risco_retorno_minimo: 2.0
  stop_obrigatorio: true
  revisoes_de_entrada: 1
  zerar_no_fim_do_dia: true

portoes_depois_do_dia_1:     # "plano mais ativo", conforme relatado
  risco_retorno_minimo: 1.5
  revisoes_de_entrada: 3
  filtros: menos_restritivos
